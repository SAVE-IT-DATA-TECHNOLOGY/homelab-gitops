apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SAVE-IT-DATA-TECHNOLOGY/homelab-gitops.git
    targetRevision: main
    path: apps/home
  destination:
    server: https://kubernetes.default.svc
    namespace: home
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
