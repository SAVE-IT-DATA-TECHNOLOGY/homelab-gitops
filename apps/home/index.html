<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="home.lab landing page">
  <meta name="color-scheme" content="light dark">
  <title>home.lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6677;
      --border: #dde1e8; --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #9aa3b2;
        --border: #2a313d; --accent: #6ea0ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
    }
    main { width: 100%; max-width: 760px; margin: 0 auto; padding: 48px 16px; flex: 1; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .sub { margin: 0 0 32px; color: var(--muted); }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    a.card {
      display: block; padding: 16px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); color: inherit; text-decoration: none;
    }
    a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
    .card strong { display: block; color: var(--accent); }
    .card span { font-size: .9rem; color: var(--muted); }
    footer { padding: 16px; text-align: center; font-size: .85rem; color: var(--muted); }
    code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
  </style>
</head>
<body>
  <main>
    <h1>home.lab</h1>
    <p class="sub">K3s HA cluster · managed by Argo CD from <code>homelab-gitops</code></p>

    <h2>Services</h2>
    <div class="grid">
      <a class="card" href="https://argocd.home.lab"><strong>Argo CD</strong><span>GitOps deployments</span></a>
      <a class="card" href="https://whoami.home.lab"><strong>whoami</strong><span>Request echo / load-balancing test</span></a>
    </div>

    <h2>Source</h2>
    <div class="grid">
      <a class="card" href="https://github.com/SAVE-IT-DATA-TECHNOLOGY/homelab-gitops"><strong>homelab-gitops</strong><span>Edit <code>apps/home/index.html</code> to change this page</span></a>
    </div>
  </main>
  <footer>Served by nginx on K3sssssssss</footer>
</body>
</html>
