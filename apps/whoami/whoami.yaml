apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 5
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami        # pin a version tag for real use
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
---
# Home page: nginx serving index.html (from the ConfigMap built in kustomization.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-home
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami-home
  template:
    metadata:
      labels:
        app: whoami-home
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: html
          configMap:
            name: whoami-home-html   # kustomize rewrites this to the hashed name
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-home
spec:
  selector:
    app: whoami-home
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:                        # no secretName: Traefik keeps its default cert; Argo CD now links to https://
    - hosts:
        - whoami.home.lab
  rules:
    - host: whoami.home.lab
      http:
        paths:
          # Traefik checks the longer path first, so /whoami goes to the echo pods
          - path: /whoami
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
          # everything else, including /, is the home page
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami-home
                port:
                  number: 80
