apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - whoami.yaml
configMapGenerator:
  # Builds a ConfigMap from index.html. Its name gets a content hash,
  # so pushing a changed index.html rolls the whoami-home pods on sync.
  - name: whoami-home-html
    files:
      - index.html
